<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub Church — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    /* Reuse the same CSS from register.html */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --brand: #39FF14; --brand-2: #2ECC0E; --danger: #FF7A00; --warning: #FFD700;
        --text: #f5fff9; --muted: #a4b8ad; --card-border: rgba(57, 255, 20, .18);
    }
    html, body { width: 100%; min-height: 100%; background: #111; color: var(--text); font-family: 'Inter', sans-serif; }
    .bg-overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none;
        background: radial-gradient(1200px 800px at 15% 20%, rgba(57,255,20,.15), transparent 60%),
                    linear-gradient(180deg, rgba(17,17,17,.95), rgba(17,17,17,.85)); }
    .page { position: relative; z-index: 3; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; }
    .card { width: 100%; max-width: 440px; padding: 2.75rem 2.25rem; border-radius: 24px;
        background: linear-gradient(180deg, rgba(57,255,20,.08), rgba(57,255,20,.02));
        border: 1px solid var(--card-border); backdrop-filter: blur(22px); }
    h1 { font-size: 1.75rem; margin-bottom: .4rem; color: #fff; }
    .subtitle { color: var(--muted); font-size: .92rem; margin-bottom: 2rem; }
    .field { position: relative; margin-bottom: 1.05rem; }
    .field input { width: 100%; height: 56px; padding: 1.35rem 1.05rem 0; color: var(--text);
        background: rgba(57,255,20,.06); border: 1px solid rgba(57,255,20,.14); border-radius: 14px; outline: none; transition: all .25s; }
    .field input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(57,255,20,.18); }
    .field label { position: absolute; left: 1.05rem; top: 50%; transform: translateY(-50%);
        color: var(--muted); font-size: .98rem; pointer-events: none; transition: all .22s; }
    .field input:focus + label, .field input:not(:placeholder-shown) + label { top: 15px; font-size: .72rem; text-transform: uppercase; color: var(--brand); font-weight: 600; }
    .submit { width: 100%; height: 54px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: #000; font-weight: 700; cursor: pointer; box-shadow: 0 12px 32px rgba(57,255,20,.45); transition: transform .18s; margin-top: 1rem; }
    .submit:hover { transform: translateY(-2px); }
    .foot { margin-top: 1.75rem; text-align: center; font-size: .85rem; color: var(--muted); }
    .foot a { color: var(--warning); text-decoration: none; font-weight: 500; }
    .toast { position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%) translateY(-140%); padding: .85rem 1.25rem;
        border-radius: 12px; background: rgba(17,17,17,.95); border: 1px solid rgba(57,255,20,.22); display: inline-flex;
        align-items: center; gap: .6rem; opacity: 0; transition: all .5s; z-index: 100; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { border-color: rgba(255,122,0,.5); } .toast.success { border-color: rgba(57,255,20,.5); }
    .toast__dot { width: 8px; height: 8px; border-radius: 50%; }
    .toast.error .toast__dot { background: var(--danger); } .toast.success .toast__dot { background: var(--brand); }
</style>
</head>
<body>
<div class="bg-overlay"></div>
<div class="page">
    <div class="card">
        <h1>Forgot Password</h1>
        <p class="subtitle">Enter your email and we'll send you a 5-digit code to reset your password.</p>
        <form id="forgotForm">
            <div class="field">
                <input type="email" id="email" placeholder=" " required>
                <label for="email">Email Address</label>
            </div>
            <button type="submit" class="submit" id="submitBtn">Send Reset Code</button>
        </form>
        <p class="foot"><a href="login.html">Back to Login</a></p>
    </div>
</div>
<div class="toast" id="toast"><span class="toast__dot"></span><span id="toastMsg"></span></div>

<script>
(() => {
    const API = 'class/ApiHandler.php';
    const toast = document.getElementById('toast'), toastMsg = document.getElementById('toastMsg');
    let tid;
    function showToast(msg, type='error') {
        toast.className = 'toast ' + type; toastMsg.textContent = msg;
        toast.classList.add('show'); clearTimeout(tid);
        tid = setTimeout(() => toast.classList.remove('show'), 5000);
    }

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) return showToast('Please enter your email');

        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Sending...';

        try {
            const res = await fetch(`${API}?action=special&entity=auth`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task: 'request_reset', email })
            });
            const data = await res.json();

            if (data.success) {
                // In production, remove the debug_otp alert. For now, it helps you test.
                showToast(`Code sent! (Debug OTP: ${data.debug_otp})`, 'success', 8000);
                // Store email in sessionStorage to use on the reset page
                sessionStorage.setItem('reset_email', email);
                setTimeout(() => { window.location.href = 'reset.php'; }, 2500);
            } else {
                showToast(data.message || 'Failed to send code');
                btn.disabled = false; btn.textContent = 'Send Reset Code';
            }
        } catch (err) {
            showToast('Network error. Please try again.');
            btn.disabled = false; btn.textContent = 'Send Reset Code';
        }
    });
})();
</script>
</body>
</html>
